<mat-card class="card">
    <mat-card-header>        
        <div class="header-card">           
            <img  class="header-image" src="img-card.jpg" alt="Photo">
            <img class="tag-image" src="tag-card.svg" alt="tag">
        </div>        
        
     </mat-card-header>
 
     <mat-card-content>
        <p class="location">
            Marruecos, África <span>9 días</span>
        </p>
        <p class="description">
            Descubre Bangkok con Iberojet
        </p>
    </mat-card-content>
    <mat-card-actions>
        <div class="price">
            <div class="text">
                <span>Desde</span>        
                <p class="price-number">248,00 €</p>
            </div>
            
            <button class="popover">Ver desglose
                <img class="arrow-down" src="arrow-down-violet.svg" alt="arrow">
            </button>
        </div>        
        <button class="white-buttom">Reservar</button>
    </mat-card-actions>
</mat-card>
